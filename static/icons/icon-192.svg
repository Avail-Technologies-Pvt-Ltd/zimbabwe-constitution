<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="zimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#006400"/>
      <stop offset="50%" stop-color="#144a14"/>
      <stop offset="100%" stop-color="#0b240b"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE066"/>
      <stop offset="100%" stop-color="#D4AF37"/>
    </linearGradient>
  </defs>
  <!-- Background circle with subtle gold border -->
  <rect width="192" height="192" rx="36" fill="url(#zimGrad)"/>
  <rect x="4" y="4" width="184" height="184" rx="32" fill="none" stroke="url(#goldGrad)" stroke-width="3" opacity="0.6"/>
  
  <!-- Scales of Justice / Constitution Book Symbol -->
  <g transform="translate(96, 92)" fill="url(#goldGrad)">
    <!-- Central Pillar -->
    <path d="M-4 -36 L4 -36 L4 32 L-4 32 Z" />
    <!-- Pedestal Base -->
    <path d="M-22 32 L22 32 L26 40 L-26 40 Z" />
    <path d="M-30 40 L30 40 L30 44 L-30 44 Z" />
    <!-- Balance Beam -->
    <path d="M-44 -26 L44 -26 L44 -22 L-44 -22 Z" />
    <circle cx="0" cy="-24" r="5" fill="#FFE066"/>
    <!-- Left Scale Bowl & Strings -->
    <line x1="-38" y1="-22" x2="-48" y2="-4" stroke="#FFE066" stroke-width="1.8"/>
    <line x1="-38" y1="-22" x2="-28" y2="-4" stroke="#FFE066" stroke-width="1.8"/>
    <path d="M-52 -4 Q -38 12 -24 -4 Z" fill="url(#goldGrad)"/>
    <!-- Right Scale Bowl & Strings -->
    <line x1="38" y1="-22" x2="28" y2="-4" stroke="#FFE066" stroke-width="1.8"/>
    <line x1="38" y1="-22" x2="48" y2="-4" stroke="#FFE066" stroke-width="1.8"/>
    <path d="M24 -4 Q 38 12 52 -4 Z" fill="url(#goldGrad)"/>
    <!-- Open Book Crest at top -->
    <path d="M0 -34 Q -16 -44 -32 -38 L -32 -28 Q -16 -34 0 -26 Q 16 -34 32 -28 L 32 -38 Q 16 -44 0 -34 Z" fill="#FFE066" opacity="0.9"/>
  </g>
  
  <!-- Subtle national flag stripe accents -->
  <rect x="36" y="160" width="24" height="4" rx="2" fill="#006400"/>
  <rect x="64" y="160" width="24" height="4" rx="2" fill="#FFD700"/>
  <rect x="92" y="160" width="24" height="4" rx="2" fill="#D40000"/>
  <rect x="120" y="160" width="24" height="4" rx="2" fill="#000000"/>
</svg>
