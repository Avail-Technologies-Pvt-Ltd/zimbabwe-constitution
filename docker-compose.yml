services:
  constitution-django:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${DOCKER_IMAGE:-availtechnologies/zimbabwe-constitution:latest}
    container_name: zim-constitution-prod
    restart: ${RESTART_POLICY:-unless-stopped}
    ports:
      - "${PORT:-8088}:8000"
    env_file:
      - .env.prod
    volumes:
      - sqlite_data:/app/db_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  sqlite_data:
